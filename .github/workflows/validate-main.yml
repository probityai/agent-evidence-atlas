name: Validate the deployed Probity evidence lab through native CI

on:
  push:
    branches: ['ops/validate-atlas-lab-main-2003bbc']
    paths: ['.github/workflows/validate-main.yml', 'ops/pr-completion/dispatch_merged.py']

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-atlas-lab-main-2003bbc
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the reviewed dispatch driver
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = '874634c39cf427d1ffd997554a7597d33cf97c747c7f955db47885633fb340bb'
          actual = hashlib.sha256(Path('ops/pr-completion/dispatch_merged.py').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Dispatch driver changed: expected={expected} actual={actual}')
          print(f'Reviewed dispatch driver sha256={actual}')
          PY
      - name: Verify the deployed lab page and exact register before native validation
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request

          base = 'https://probityai.github.io/agent-evidence-atlas/'
          expected_register = '837ffa2071fb876b08a9c9ce2281245e8149601a483e9428e227bf3b3c39b0c1'
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(base + 'lab.html', timeout=20) as response:
                      page = response.read()
                  with urllib.request.urlopen(base + 'lab/register.json', timeout=20) as response:
                      register = response.read()
                  if b'Probity Open Evidence Lab' not in page:
                      raise ValueError('Deployed page lacks the lab title')
                  if hashlib.sha256(register).hexdigest() != expected_register:
                      raise ValueError('Deployed register differs from the approved bytes')
                  document = json.loads(register)
                  if document['records'][0]['id'] != 'E6-observer-admission':
                      raise ValueError('Deployed register has the wrong record')
                  print('Live lab page: HTTP 200; approved register SHA-256=' + expected_register)
                  break
              except (urllib.error.URLError, ValueError) as error:
                  if attempt == 4:
                      raise
                  print('Waiting for the approved Pages deployment: ' + str(error))
                  time.sleep(5)
          PY
      - name: Validate the already merged PR and dispatch native jobs
        run: |
          python3 ops/pr-completion/dispatch_merged.py \
            --repository 'probityai/agent-evidence-atlas' \
            --pr-number 4 \
            --approved-head '3b281abf37763a3359cc6a1f4989d4b17efd556d' \
            --expected-merge '2003bbcca93c81372ce8adece5db47cf17c6416b' \
            --workflow 'site.yml' \
            --audit "$GITHUB_WORKSPACE/native-validation-audit"
      - name: Retain the actual merge and native run observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-validation-atlas-2003bbc
          path: native-validation-audit/
          if-no-files-found: error
          retention-days: 14
